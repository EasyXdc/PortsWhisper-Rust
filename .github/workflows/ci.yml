name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust-core:
    name: Rust core checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test

  node-package:
    name: Node package verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pack npm tarball
        run: npm pack

      - name: Verify postinstall skip path
        shell: bash
        run: PORTS_RS_SKIP_DOWNLOAD=1 node scripts/postinstall.js

      - name: Verify packaged install path
        shell: bash
        run: |
          PACKAGE_TGZ=$(node -p "const pkg = require('./package.json'); pkg.name + '-' + pkg.version + '.tgz'")
          TMP_DIR=$(mktemp -d)
          EXT=$(node -p "process.platform === 'win32' ? '.exe' : ''")
          npm install --prefix "$TMP_DIR" "./$PACKAGE_TGZ"
          test -f "$TMP_DIR/node_modules/ports-rs/vendor/ports$EXT"
          test -f "$TMP_DIR/node_modules/ports-rs/vendor/whoisonport$EXT"
          node "$TMP_DIR/node_modules/ports-rs/bin/ports.js" --help
          node "$TMP_DIR/node_modules/ports-rs/bin/whoisonport.js" --help
          "$TMP_DIR/node_modules/ports-rs/vendor/ports$EXT" --help
          "$TMP_DIR/node_modules/ports-rs/vendor/whoisonport$EXT" --help
