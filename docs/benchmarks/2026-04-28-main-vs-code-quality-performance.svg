<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Main vs Code Quality Branch Benchmark</title>
  <desc id="desc">Release-mode hyperfine mean runtimes in milliseconds for main and fix/code-quality-improvements.</desc>
  <rect width="920" height="430" fill="#ffffff"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Main vs Code Quality Branch Performance</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Mean runtime, lower is better. hyperfine --warmup 3, macOS local sample.</text>

  <rect x="610" y="32" width="18" height="12" fill="#64748b"/>
  <text x="636" y="42" font-family="Arial, sans-serif" font-size="13" fill="#374151">main</text>
  <rect x="700" y="32" width="18" height="12" fill="#10b981"/>
  <text x="726" y="42" font-family="Arial, sans-serif" font-size="13" fill="#374151">branch</text>

  <line x1="170" y1="370" x2="520" y2="370" stroke="#d1d5db" stroke-width="1"/>
  <line x1="170" y1="90" x2="170" y2="370" stroke="#d1d5db" stroke-width="1"/>
  <text x="165" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">0</text>
  <text x="265" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">20ms</text>
  <text x="365" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">40ms</text>
  <text x="465" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">60ms</text>
  <line x1="270" y1="90" x2="270" y2="370" stroke="#eef2f7" stroke-width="1"/>
  <line x1="370" y1="90" x2="370" y2="370" stroke="#eef2f7" stroke-width="1"/>
  <line x1="470" y1="90" x2="470" y2="370" stroke="#eef2f7" stroke-width="1"/>

  <text x="32" y="119" font-family="Arial, sans-serif" font-size="14" fill="#111827">ports</text>
  <rect x="170" y="96" width="338.5" height="18" rx="3" fill="#64748b"/>
  <rect x="170" y="120" width="341.0" height="18" rx="3" fill="#10b981"/>
  <text x="520" y="110" font-family="Arial, sans-serif" font-size="12" fill="#374151">67.7 ms</text>
  <text x="520" y="134" font-family="Arial, sans-serif" font-size="12" fill="#374151">68.2 ms (+0.8%)</text>

  <text x="32" y="184" font-family="Arial, sans-serif" font-size="14" fill="#111827">ports ps</text>
  <rect x="170" y="161" width="25.0" height="18" rx="3" fill="#64748b"/>
  <rect x="170" y="185" width="23.0" height="18" rx="3" fill="#10b981"/>
  <text x="205" y="175" font-family="Arial, sans-serif" font-size="12" fill="#374151">5.0 ms</text>
  <text x="205" y="199" font-family="Arial, sans-serif" font-size="12" fill="#374151">4.6 ms (-6.9%)</text>

  <text x="32" y="249" font-family="Arial, sans-serif" font-size="14" fill="#111827">ports 3000</text>
  <rect x="170" y="226" width="187.0" height="18" rx="3" fill="#64748b"/>
  <rect x="170" y="250" width="185.5" height="18" rx="3" fill="#10b981"/>
  <text x="368" y="240" font-family="Arial, sans-serif" font-size="12" fill="#374151">37.4 ms</text>
  <text x="368" y="264" font-family="Arial, sans-serif" font-size="12" fill="#374151">37.1 ms (-1.0%)</text>

  <text x="32" y="314" font-family="Arial, sans-serif" font-size="14" fill="#111827">ports check 3000</text>
  <rect x="170" y="291" width="199.5" height="18" rx="3" fill="#64748b"/>
  <rect x="170" y="315" width="188.0" height="18" rx="3" fill="#10b981"/>
  <text x="382" y="305" font-family="Arial, sans-serif" font-size="12" fill="#374151">39.9 ms</text>
  <text x="382" y="329" font-family="Arial, sans-serif" font-size="12" fill="#374151">37.6 ms (-5.8%)</text>

  <text x="610" y="112" font-family="Arial, sans-serif" font-size="13" fill="#111827" font-weight="700">Takeaways</text>
  <text x="610" y="138" font-family="Arial, sans-serif" font-size="13" fill="#374151">Top-level list: flat vs main.</text>
  <text x="610" y="162" font-family="Arial, sans-serif" font-size="13" fill="#374151">Process list: small local win.</text>
  <text x="610" y="186" font-family="Arial, sans-serif" font-size="13" fill="#374151">Single-port lookup: flat.</text>
  <text x="610" y="210" font-family="Arial, sans-serif" font-size="13" fill="#374151">Small port check: faster.</text>
  <text x="610" y="252" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Note: Windows PowerShell reductions are</text>
  <text x="610" y="270" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">not directly measurable on this macOS run.</text>
</svg>
