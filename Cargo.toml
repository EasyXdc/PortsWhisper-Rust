[package]
name = "port-whisperer"
version = "0.2.3"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
unicode-width = "0.2"
wait-timeout = "0.2"
terminal_size = "0.4"

[lib]
name = "port_whisperer"
path = "src/lib.rs"

[[bin]]
name = "ports"
path = "src/main.rs"

[[bin]]
name = "whoisonport"
path = "src/bin/whoisonport.rs"
